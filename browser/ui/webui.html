<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>OZ Browser</title>
    <style>
      :root {
        --bg-color: #1f1f2e;
        --bg-elevated: #2a2a3d;
        --text-color: #ececec;
        --text-muted: #9090a0;
        --tab-color: #3d3d57;
        --accent: #6c8eef;
        --danger: #f87171;
        --sidebar-width: 220px;
        --toolbar-height: 64px;

        /* electron-chrome-extensions colors */
        --browser-action-badge-outline: var(--tab-color);
      }

      *, *:before, *:after {
        box-sizing: border-box;
        user-select: none;
      }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg-color);
        color: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe WPC", "Segoe UI", sans-serif;
        font-size: 14px;
      }

      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      ul { margin: 0; padding: 0; list-style: none; }
      button { font-family: inherit; }

      /*----- TOPBAR (existing tabstrip + toolbar) -----*/

      .topbar {
        background: var(--bg-color);
        flex: 0 0 auto;
        height: var(--toolbar-height);
      }

      #tabstrip {
        width: 100%;
        height: calc(env(titlebar-area-height, 31px) + 1px);
      }

      .tab-container {
        position: fixed;
        left: env(titlebar-area-x);
        top: env(titlebar-area-y);
        width: env(titlebar-area-width);
        height: calc(env(titlebar-area-height, 31px) + 1px);
        display: flex;
        flex-direction: row;
      }

      .tab-list {
        height: 100%;
        display: flex;
        flex-direction: row;
        min-width: 0;
      }

      #createtab {
        background: transparent;
        border: none;
        color: #fff;
        font-weight: bold;
        font-family: 'Courier New', Courier, monospace;
      }
      #createtab:hover { background: rgba(255,255,255,0.2); }

      .tab {
        padding: 0.2rem 0.4rem;
        height: 100%;
        overflow: hidden;
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        width: 12rem;
        box-shadow: inset -1px 0 0 0 rgba(0,0,0,0.33);
      }
      .tab[data-active] { background: var(--tab-color); }
      .tab .favicon[src] { display: none; width: 16px; height: 16px; margin-right: 0.2rem; }
      .tab .favicon[src].loaded { display: block; }
      .tab .title {
        white-space: nowrap;
        flex: 1 1 auto;
        min-width: 0;
        text-overflow: ellipsis;
        overflow: hidden;
        font-size: 0.725rem;
      }
      .tab .controls { flex: 0 0 auto; font-size: 0; }
      .tab .controls .control {
        background: rgba(0,0,0,0.2);
        border: none;
        border-radius: 50%;
        padding: 0;
        margin-left: 0.2rem;
        width: 1rem;
        height: 1rem;
        color: #aaa;
        font-size: 0.7rem;
        line-height: 0;
      }
      .tab .controls .control:disabled { display: none; }

      .app-drag {
        flex: 1 0 auto;
        -webkit-app-region: drag;
        height: calc(100% - 5px);
        min-width: 2rem;
        align-self: flex-end;
      }

      .window-controls { display: none; flex-direction: row; flex: 0 0 auto; }
      .platform-linux .window-controls { display: flex; }
      .window-controls .control { width: 2.5rem; background: none; border: none; color: #fff; }
      .window-controls .control:hover { background: rgba(255, 255, 255, 0.2); }

      /*----- TOOLBAR (back/fwd/reload + omnibox) -----*/

      .toolbar {
        height: 1.875rem;
        background-color: var(--tab-color);
        display: flex;
        align-items: center;
        padding: 0.2rem 0.5rem;
      }
      .toolbar .page-controls { margin-right: 0.5rem; }
      .address-bar { flex: 1 0 auto; line-height: 0; height: 100%; }
      .address-bar input {
        width: 100%;
        height: 100%;
        background: var(--bg-color);
        color: var(--text-color);
        border: none;
        border-radius: 2rem;
        padding: 0 0.75rem;
        outline: none;
        user-select: text;
      }
      .toolbar .control {
        background: none;
        border: none;
        width: 1.5rem;
        height: 1.5rem;
        padding: 0;
        line-height: 0;
        color: var(--text-color);
      }

      /*----- BOTTOM (sidebar + content) -----*/

      .bottom {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
      }

      #oz-sidebar {
        width: var(--sidebar-width);
        flex: 0 0 var(--sidebar-width);
        background: var(--bg-elevated);
        overflow-y: auto;
        padding: 8px 8px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        border-right: 1px solid rgba(255,255,255,0.05);
      }

      #oz-sidebar .header {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-muted);
        font-weight: 600;
      }

      #oz-sidebar .new-identity {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 8px;
        background: transparent;
        border: 1px dashed rgba(255,255,255,0.15);
        border-radius: 6px;
        color: var(--text-muted);
        font-size: 12px;
        cursor: pointer;
        margin-bottom: 6px;
      }
      #oz-sidebar .new-identity:hover {
        background: rgba(255,255,255,0.04);
        color: var(--text-color);
      }

      .identity {
        display: flex;
        flex-direction: column;
        margin-top: 2px;
      }

      .identity-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 6px;
        cursor: pointer;
        position: relative;
      }
      .identity-row:hover { background: rgba(255,255,255,0.04); }
      .identity-row.active { background: rgba(255,255,255,0.08); }

      .identity-chip {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: 0 0 auto;
      }
      .identity-name {
        flex: 1 1 auto;
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .identity-name input {
        background: var(--bg-color);
        border: 1px solid var(--accent);
        border-radius: 3px;
        color: var(--text-color);
        font-size: 13px;
        padding: 1px 4px;
        width: 100%;
      }
      .identity-row .add-tab {
        flex: 0 0 auto;
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1;
        padding: 2px 4px;
        border-radius: 4px;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .identity-row:hover .add-tab { opacity: 1; }
      .identity-row .add-tab:hover { background: rgba(255,255,255,0.1); color: var(--text-color); }

      .identity-tabs {
        display: flex;
        flex-direction: column;
        margin-left: 14px;
        margin-bottom: 4px;
      }

      .oz-tab {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px 4px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        color: var(--text-color);
        position: relative;
      }
      .oz-tab:hover { background: rgba(255,255,255,0.04); }
      .oz-tab.active {
        background: rgba(108, 142, 239, 0.2);
        box-shadow: inset 2px 0 0 0 var(--accent);
      }
      .oz-tab .oz-favicon {
        width: 12px;
        height: 12px;
        flex: 0 0 auto;
        opacity: 0.7;
      }
      .oz-tab .oz-favicon.lazy {
        background: rgba(255,255,255,0.15);
        border-radius: 50%;
      }
      .oz-tab .oz-title {
        flex: 1 1 auto;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .oz-tab.lazy .oz-title { color: var(--text-muted); font-style: italic; }
      .oz-tab .oz-close {
        flex: 0 0 auto;
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-size: 11px;
        padding: 0 4px;
        opacity: 0;
        cursor: pointer;
      }
      .oz-tab:hover .oz-close { opacity: 1; }
      .oz-tab .oz-close:hover { color: var(--text-color); }

      #oz-content { flex: 1; min-width: 0; }

      .ctx-menu {
        position: fixed;
        background: var(--bg-elevated);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 6px;
        padding: 4px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.5);
        font-size: 12px;
        z-index: 9999;
        min-width: 140px;
      }
      .ctx-menu button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: var(--text-color);
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
      }
      .ctx-menu button:hover { background: rgba(255,255,255,0.08); }
      .ctx-menu button.danger { color: var(--danger); }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div id="tabstrip">
        <div class="tab-container">
          <ul class="tab-list">
            <template id="tabtemplate">
              <li class="tab">
                <img class="favicon" />
                <span class="title"></span>
                <div class="controls">
                  <button class="control audio" disabled>🔊</button>
                  <button class="control close">✕</button>
                </div>
              </li>
            </template>
          </ul>
          <button id="createtab">+</button>
          <div class="app-drag"></div>
          <div class="window-controls">
            <button id="minimize" class="control">🗕</button>
            <button id="maximize" class="control">🗖</button>
            <button id="close" class="control">🗙</button>
          </div>
        </div>
      </div>
      <div class="toolbar">
        <div class="page-controls">
          <button id="goback" class="control">⬅</button>
          <button id="goforward" class="control">➡</button>
          <button id="reload" class="control">⟳</button>
        </div>
        <div class="address-bar">
          <input id="addressurl" spellcheck="false" />
        </div>
        <browser-action-list id="actions" alignment="bottom left"></browser-action-list>
      </div>
    </div>

    <div class="bottom">
      <aside id="oz-sidebar">
        <button class="new-identity" id="oz-new-identity">＋ New Identity</button>
        <div class="header">Identities</div>
        <div id="oz-identity-list"></div>
      </aside>
      <div id="oz-content"></div>
    </div>

    <script src="./webui.js"></script>
  </body>
</html>
