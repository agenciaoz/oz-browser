<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>OZ Browser</title>
    <style>
      :root {
        --bg-color: #1f1f2e;
        --bg-elevated: #2a2a3d;
        --text-color: #ececec;
        --text-muted: #9090a0;
        --tab-color: #3d3d57;
        --accent: #6c8eef;
        --danger: #f87171;
        --sidebar-width: 220px;
        --toolbar-height: 64px;

        /* electron-chrome-extensions colors */
        --browser-action-badge-outline: var(--tab-color);
      }

      *, *:before, *:after {
        box-sizing: border-box;
        user-select: none;
      }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg-color);
        color: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe WPC", "Segoe UI", sans-serif;
        font-size: 14px;
      }

      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      ul { margin: 0; padding: 0; list-style: none; }
      button { font-family: inherit; }

      /*----- TOPBAR (existing tabstrip + toolbar) -----*/

      .topbar {
        background: var(--bg-color);
        flex: 0 0 auto;
        height: var(--toolbar-height);
      }

      #tabstrip {
        width: 100%;
        height: calc(env(titlebar-area-height, 31px) + 1px);
      }

      .tab-container {
        position: fixed;
        left: env(titlebar-area-x);
        top: env(titlebar-area-y);
        width: env(titlebar-area-width);
        height: calc(env(titlebar-area-height, 31px) + 1px);
        display: flex;
        flex-direction: row;
      }

      .tab-list {
        height: 100%;
        display: flex;
        flex-direction: row;
        min-width: 0;
      }

      #createtab {
        background: transparent;
        border: none;
        color: #fff;
        font-weight: bold;
        font-family: 'Courier New', Courier, monospace;
      }
      #createtab:hover { background: rgba(255,255,255,0.2); }

      .tab {
        padding: 0.2rem 0.4rem;
        height: 100%;
        overflow: hidden;
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        width: 12rem;
        box-shadow: inset -1px 0 0 0 rgba(0,0,0,0.33);
      }
      .tab[data-active] { background: var(--tab-color); }
      .tab .favicon[src] { display: none; width: 16px; height: 16px; margin-right: 0.2rem; }
      .tab .favicon[src].loaded { display: block; }
      .tab .title {
        white-space: nowrap;
        flex: 1 1 auto;
        min-width: 0;
        text-overflow: ellipsis;
        overflow: hidden;
        font-size: 0.725rem;
      }
      .tab .controls { flex: 0 0 auto; font-size: 0; }
      .tab .controls .control {
        background: rgba(0,0,0,0.2);
        border: none;
        border-radius: 50%;
        padding: 0;
        margin-left: 0.2rem;
        width: 1rem;
        height: 1rem;
        color: #aaa;
        font-size: 0.7rem;
        line-height: 0;
      }
      .tab .controls .control:disabled { display: none; }

      .app-drag {
        flex: 1 0 auto;
        -webkit-app-region: drag;
        height: calc(100% - 5px);
        min-width: 2rem;
        align-self: flex-end;
      }

      .window-controls { display: none; flex-direction: row; flex: 0 0 auto; }
      .platform-linux .window-controls { display: flex; }
      .window-controls .control { width: 2.5rem; background: none; border: none; color: #fff; }
      .window-controls .control:hover { background: rgba(255, 255, 255, 0.2); }

      /*----- TOOLBAR (back/fwd/reload + omnibox) -----*/

      .toolbar {
        height: 1.875rem;
        background-color: var(--tab-color);
        display: flex;
        align-items: center;
        padding: 0.2rem 0.5rem;
      }
      .toolbar .page-controls { margin-right: 0.5rem; }
      .address-bar { flex: 1 0 auto; line-height: 0; height: 100%; }
      .address-bar input {
        width: 100%;
        height: 100%;
        background: var(--bg-color);
        color: var(--text-color);
        border: none;
        border-radius: 2rem;
        padding: 0 0.75rem;
        outline: none;
        user-select: text;
      }
      .toolbar .control {
        background: none;
        border: none;
        width: 1.5rem;
        height: 1.5rem;
        padding: 0;
        line-height: 0;
        color: var(--text-color);
      }

      /*----- BOTTOM (sidebar + content) -----*/

      .bottom {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
      }

      #oz-sidebar {
        width: var(--sidebar-width);
        flex: 0 0 var(--sidebar-width);
        background: var(--bg-elevated);
        overflow-y: auto;
        padding: 8px 8px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        border-right: 1px solid rgba(255,255,255,0.05);
      }

      #oz-sidebar .header {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-muted);
        font-weight: 600;
      }

      #oz-sidebar .new-identity {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 8px;
        background: transparent;
        border: 1px dashed rgba(255,255,255,0.15);
        border-radius: 6px;
        color: var(--text-muted);
        font-size: 12px;
        cursor: pointer;
        margin-bottom: 6px;
      }
      #oz-sidebar .new-identity:hover {
        background: rgba(255,255,255,0.04);
        color: var(--text-color);
      }

      .identity {
        display: flex;
        flex-direction: column;
        margin-top: 2px;
      }

      .identity-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 6px;
        cursor: pointer;
        position: relative;
      }
      .identity-row:hover { background: rgba(255,255,255,0.04); }
      .identity-row.active { background: rgba(255,255,255,0.08); }

      .identity-chip {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: 0 0 auto;
      }
      .identity-name {
        flex: 1 1 auto;
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .identity-row.default .identity-name::after {
        content: '·';
        color: var(--text-muted);
        margin-left: 6px;
        font-weight: 400;
      }
      .identity-count {
        flex: 0 0 auto;
        font-size: 11px;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
        margin-right: 2px;
      }
      .identity-count.zero { opacity: 0.45; }
      .identity-name input {
        background: var(--bg-color);
        border: 1px solid var(--accent);
        border-radius: 3px;
        color: var(--text-color);
        font-size: 13px;
        padding: 1px 4px;
        width: 100%;
      }
      .identity-row .add-tab {
        flex: 0 0 auto;
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1;
        padding: 2px 4px;
        border-radius: 4px;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .identity-row:hover .add-tab { opacity: 1; }
      .identity-row .add-tab:hover { background: rgba(255,255,255,0.1); color: var(--text-color); }

      .identity-tabs {
        display: flex;
        flex-direction: column;
        margin-left: 14px;
        margin-bottom: 4px;
      }

      .oz-tab {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px 4px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        color: var(--text-color);
        position: relative;
      }
      .oz-tab:hover { background: rgba(255,255,255,0.04); }
      .oz-tab.active {
        background: rgba(108, 142, 239, 0.2);
        box-shadow: inset 2px 0 0 0 var(--accent);
      }
      .oz-tab .oz-favicon {
        width: 12px;
        height: 12px;
        flex: 0 0 auto;
        opacity: 0.7;
      }
      .oz-tab .oz-favicon.lazy {
        background: rgba(255,255,255,0.15);
        border-radius: 50%;
      }
      .oz-tab .oz-title {
        flex: 1 1 auto;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .oz-tab.lazy .oz-title { color: var(--text-muted); font-style: italic; }
      .oz-tab .oz-close {
        flex: 0 0 auto;
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-size: 11px;
        padding: 0 4px;
        opacity: 0;
        cursor: pointer;
      }
      .oz-tab:hover .oz-close { opacity: 1; }
      .oz-tab .oz-close:hover { color: var(--text-color); }

      #oz-content { flex: 1; min-width: 0; }

      .ctx-menu {
        position: fixed;
        background: var(--bg-elevated);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 6px;
        padding: 4px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.5);
        font-size: 12px;
        z-index: 9999;
        min-width: 140px;
      }
      .ctx-menu button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: var(--text-color);
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
      }
      .ctx-menu button:hover { background: rgba(255,255,255,0.08); }
      .ctx-menu button.danger { color: var(--danger); }

      /*----- IDENTITY EDITOR MODAL -----*/

      .oz-modal[hidden] { display: none !important; }
      .oz-modal {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .oz-modal-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.55);
        backdrop-filter: blur(2px);
      }
      .oz-modal-window {
        position: relative;
        width: 420px;
        max-width: calc(100% - 32px);
        background: var(--bg-elevated);
        border-radius: 10px;
        box-shadow: 0 12px 36px rgba(0,0,0,0.6);
        padding: 18px 20px 16px;
        color: var(--text-color);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .oz-modal-window header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0;
      }
      .oz-modal-window h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      .oz-modal-close {
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-size: 16px;
        cursor: pointer;
        padding: 0 4px;
      }
      .oz-modal-close:hover { color: var(--text-color); }

      .oz-modal label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-weight: 600;
      }
      .oz-modal input[type="text"],
      .oz-modal textarea {
        background: var(--bg-color);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 5px;
        color: var(--text-color);
        padding: 7px 9px;
        font: inherit;
        outline: none;
        text-transform: none;
        letter-spacing: normal;
        font-weight: 400;
        user-select: text;
      }
      .oz-modal textarea {
        resize: vertical;
        min-height: 56px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11.5px;
      }
      .oz-modal input:focus,
      .oz-modal textarea:focus { border-color: var(--accent); }
      .oz-modal small {
        color: var(--text-muted);
        font-size: 11px;
        text-transform: none;
        letter-spacing: normal;
        font-weight: 400;
        line-height: 1.4;
      }

      .color-swatches {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .color-swatches button {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        padding: 0;
      }
      .color-swatches button.selected {
        border-color: var(--text-color);
        box-shadow: 0 0 0 2px var(--bg-elevated), 0 0 0 3px var(--accent);
      }

      .oz-modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 4px;
      }
      .oz-modal-actions button {
        padding: 7px 14px;
        border-radius: 6px;
        border: 1px solid transparent;
        cursor: pointer;
        font: inherit;
        font-weight: 500;
      }
      .oz-btn-cancel {
        background: transparent;
        color: var(--text-muted);
        border-color: rgba(255,255,255,0.12);
      }
      .oz-btn-cancel:hover { color: var(--text-color); }
      .oz-btn-save {
        background: var(--accent);
        color: #fff;
      }
      .oz-btn-save:hover { background: #5a7be0; }
      .oz-btn-secondary {
        background: transparent;
        color: var(--text-muted);
        border-color: rgba(255,255,255,0.12);
        font-size: 11px;
        padding: 4px 9px;
      }

      .oz-modal .ua-row {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: space-between;
      }
      .oz-modal .ua-row > span {
        font-size: 12px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-weight: 600;
      }

      .oz-modal-error {
        background: rgba(248, 113, 113, 0.15);
        color: var(--danger);
        border-radius: 5px;
        padding: 8px 10px;
        font-size: 12px;
        text-transform: none;
        letter-spacing: normal;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div id="tabstrip">
        <div class="tab-container">
          <ul class="tab-list">
            <template id="tabtemplate">
              <li class="tab">
                <img class="favicon" />
                <span class="title"></span>
                <div class="controls">
                  <button class="control audio" disabled>🔊</button>
                  <button class="control close">✕</button>
                </div>
              </li>
            </template>
          </ul>
          <button id="createtab">+</button>
          <div class="app-drag"></div>
          <div class="window-controls">
            <button id="minimize" class="control">🗕</button>
            <button id="maximize" class="control">🗖</button>
            <button id="close" class="control">🗙</button>
          </div>
        </div>
      </div>
      <div class="toolbar">
        <div class="page-controls">
          <button id="goback" class="control">⬅</button>
          <button id="goforward" class="control">➡</button>
          <button id="reload" class="control">⟳</button>
        </div>
        <div class="address-bar">
          <input id="addressurl" spellcheck="false" />
        </div>
        <browser-action-list id="actions" alignment="bottom left"></browser-action-list>
      </div>
    </div>

    <div class="bottom">
      <aside id="oz-sidebar">
        <button class="new-identity" id="oz-new-identity">＋ New Identity</button>
        <div class="header">Identities</div>
        <div id="oz-identity-list"></div>
      </aside>
      <div id="oz-content"></div>
    </div>

    <!-- Identity editor modal — managed by identity-editor.js -->
    <div class="oz-modal" id="oz-identity-modal" hidden>
      <div class="oz-modal-backdrop" data-close></div>
      <div class="oz-modal-window" role="dialog" aria-modal="true" aria-labelledby="oz-identity-modal-title">
        <header>
          <h2 id="oz-identity-modal-title">Edit Identity</h2>
          <button type="button" class="oz-modal-close" data-close aria-label="Close">✕</button>
        </header>
        <div class="oz-modal-error" id="oz-identity-modal-error" hidden></div>
        <form id="oz-identity-form" autocomplete="off">
          <label>
            Name
            <input name="name" type="text" required maxlength="60" />
          </label>
          <label>
            Color
            <div class="color-swatches" id="oz-identity-swatches"></div>
          </label>
          <label>
            <div class="ua-row">
              <span>User-Agent (HTTP)</span>
              <button type="button" class="oz-btn-secondary" id="oz-identity-ua-default">Use default</button>
            </div>
            <textarea name="userAgent" rows="3" placeholder="(default — Chromium picks the value)"></textarea>
            <small id="oz-identity-ua-hint">
              Sets the HTTP User-Agent header for this Identity's session.
              Does <strong>not</strong> yet override <code>navigator.userAgent</code>
              — full coherent fingerprint comes in Bloque 1.5. ADR 0010.
            </small>
          </label>
          <div class="oz-modal-actions">
            <button type="button" class="oz-btn-cancel" data-close>Cancel</button>
            <button type="submit" class="oz-btn-save">Save</button>
          </div>
        </form>
      </div>
    </div>

    <script src="./oz-utils.js"></script>
    <script src="./tabstrip.js"></script>
    <script src="./identity-editor.js"></script>
    <script src="./sidebar.js"></script>
    <script src="./webui.js"></script>
  </body>
</html>
