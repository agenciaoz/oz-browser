# OZ Browser — Continuous Integration
# ADR 0013: every push runs lint + check:loc + smoke tests on macos-latest.
# Free tier privado: ~3 min × ~50 pushes/mes ≈ 150 min, holgado bajo el cap
# de 2000 min/mes para repos privados.
#
# La raíz del repo de GitHub (agenciaoz/oz-browser) ES la carpeta oz-browser/
# del filesystem local — todos los paths del workflow son relativos a ella.

name: CI

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]
  schedule:
    # Nightly cron 03:00 UTC. Detecta regresiones por dependencia upstream
    # incluso sin push reciente. Solo en main.
    - cron: '0 3 * * *'

# Cancela runs viejos del mismo branch si llega uno nuevo. Ahorra minutos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + check:loc + smoke tests
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint flat config + Prettier check) — ADR 0014
        run: npm run lint

      - name: Validate 500 LOC rule (ADR 0005)
        run: npm run check:loc

      - name: Smoke tests
        run: npm test
        env:
          # Mock Electron tests no necesitan GUI display, pero algunos paths
          # ejemplo de log usan getPath('logs') — lo redirigimos a /tmp.
          CI: 'true'

      # Si CI nightly y algo falla, subimos los logs como artifact para debug.
      - name: Upload logs on failure (nightly only)
        if: failure() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: oz-logs-${{ github.run_id }}
          path: |
            ~/Library/Logs/OZ Browser/
            /tmp/oz-test-*/
          retention-days: 7
          if-no-files-found: ignore
